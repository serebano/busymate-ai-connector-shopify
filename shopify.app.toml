# Shopify app configuration — Busymate AI for Shopify (one Busymate AI tenant per store)
# Docs: https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration
#
# FORKING THIS APP? These values describe the official production app. To run your
# own copy, create an app in the Shopify Partner Dashboard (Partners > Apps > Create
# app) and run `shopify app config link` — the CLI overwrites `client_id`, and you
# set your own `name` / `handle` / `application_url` / `redirect_urls` below.
#
# `client_id` is a PUBLIC OAuth client identifier (not a secret). It is left as a
# placeholder here so a fork links its own app; `shopify app config link` writes it.

client_id = "REPLACE_WITH_PARTNER_APP_CLIENT_ID"
name = "Busymate AI"
handle = "busymate-ai"
application_url = "https://store.busymate.ai"
embedded = true

[access_scopes]
# Least-privilege. read_all_orders (>60-day orders) needs Shopify approval and is
# requested separately at review time, not here.
# read_legal_policies: the assistant is trained on the store's policies
# (Shop.shopPolicies — app/lib/kbFetch.ts); read_content covers pages.
scopes = "read_products,read_content,read_legal_policies,read_orders,read_customers,read_fulfillments,write_orders,read_returns,write_returns"

[auth]
redirect_urls = [
  "https://store.busymate.ai/auth/callback",
  "https://store.busymate.ai/auth/shopify/callback",
  "https://store.busymate.ai/api/auth/callback"
]

# --- App Proxy (storefront → app) ---
# The theme app-embed widget POSTs the logged-in customer signal to
# /apps/busymate-ai/identity on the STOREFRONT. Shopify signs the request (HMAC +
# logged_in_customer_id) and proxies it to <url>/identity — app/routes/identity.tsx
# → app/lib/storefrontIdentity.ts — which mints the customer-scoped launch JWT.
# Without this block that fetch 404s on every store and the identified-customer
# tier (order-aware answers) is unreachable. Contract test: test/appConfig.test.ts
# (proxy path == the extension's IDENTITY_URL). Takes effect on `shopify app deploy`.
[app_proxy]
url = "https://store.busymate.ai"
subpath = "busymate-ai"
prefix = "apps"

[webhooks]
api_version = "2026-07"

# --- Mandatory GDPR compliance webhooks (the #1 App Store rejection cause) ---
# Handlers MUST actually satisfy the request (export/redact tenant data;
# on shop/redact tear down the tenant). See app/routes/webhooks.compliance.tsx
[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "https://store.busymate.ai/webhooks/compliance"

# --- Lifecycle webhooks ---
[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "https://store.busymate.ai/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = [ "app/scopes_update" ]
uri = "https://store.busymate.ai/webhooks/app/scopes_update"

# Billing status sync — accept/decline/cancel/freeze/re-request converge here so
# resolveBillingAccess() reflects the real subscription (Req 1.2.2).
[[webhooks.subscriptions]]
topics = [ "app_subscriptions/update" ]
uri = "https://store.busymate.ai/webhooks/app_subscriptions/update"

# --- Storefront domains (#3718, review 5.1.2) ---
# The chat frame's frame-ancestors must name every storefront domain a shopper can
# load. A custom domain connected or changed after install re-reads the store's
# domains and repairs the tenant's allowlist (app/routes/webhooks.domains.tsx).
# These topics need no access scope. Takes effect on `shopify app deploy`; until
# then the same check runs on every afterAuth and in `npm run tenants:reconcile`.
[[webhooks.subscriptions]]
topics = [ "domains/create", "domains/update", "domains/destroy" ]
uri = "https://store.busymate.ai/webhooks/domains"

# --- KB-freshness webhooks (re-ingest the tenant KB snapshot on change) ---
[[webhooks.subscriptions]]
topics = [ "products/create", "products/update", "products/delete" ]
uri = "https://store.busymate.ai/webhooks/kb/products"

# shop/update (#52): the shop name/settings are in the knowledge snapshot. No scope needed.
# Shopify has NO webhook topic for shop policies or pages (checked against the 2026-07
# WebhookSubscriptionTopic list), and the snapshot reads neither collections, inventory
# nor theme content — so policies and pages are bounded by the 72 h freshness backstop
# (scripts/kb-freshness.ts, systemd timer deploy/systemd/busymate-ai-shopify-kb-freshness.*).
[[webhooks.subscriptions]]
topics = [ "shop/update" ]
uri = "https://store.busymate.ai/webhooks/kb/shop"

# Orders/fulfillments carry PROTECTED CUSTOMER DATA — Shopify blocks subscribing
# until the app is granted Protected Customer Data access (Partners → API access,
# review-gated). Re-enable this block once approved; the handler is already live at
# app/routes/webhooks.kb.orders.tsx
# [[webhooks.subscriptions]]
# topics = [ "orders/updated", "orders/cancelled", "fulfillments/create", "fulfillments/update" ]
# uri = "https://store.busymate.ai/webhooks/kb/orders"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false
