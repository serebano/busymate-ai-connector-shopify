name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm test
      # Advisory: compare the LIVE canonical store record (busymate.ai) against
      # this repo's derived listing artifacts (busymate-devtools#2036). Real
      # drift exits 1; an unreachable endpoint exits 2 (UNVERIFIED, not a pass).
      # Non-blocking here — the blocking comparison LOGIC is covered by
      # test/listing-drift.test.ts in `npm test`; this leg needs live network.
      - name: store listing drift-check (advisory)
        continue-on-error: true
        run: npm run drift-check
      - run: npm run build

  ops-migration-script:
    # No npm/node dependency — pure bash + coreutils, so this runs even if the
    # app build/test leg above is broken or skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: migrate-rename.sh self-test (syntax + stubbed dry-run)
        run: bash scripts/ops/test-migrate-rename.sh
