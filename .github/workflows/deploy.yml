name: deploy
# Release-only: runs on a version tag push or manual dispatch — NEVER on a normal
# branch push or a pull_request, so day-to-day commits are validated by ci.yml alone
# and this workflow never needs a secret on an untrusted event.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# OWNER-GATED secrets required (repo → Settings → Secrets):
#   SHOPIFY_CLI_PARTNERS_TOKEN  — for `shopify app deploy` (extension + app config)
#   DEPLOY_SSH_KEY, DEPLOY_HOST — for the app-server SSH deploy (store.busymate.ai)
# Each step is guarded on its secret's presence: with the secret unset the step is
# SKIPPED (job stays green), so a fresh fork/clone can tag a release without CI going red.
jobs:
  shopify-deploy:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Deploys the theme extension + app config to Shopify (versioned by Shopify).
      # Skipped unless SHOPIFY_CLI_PARTNERS_TOKEN is configured.
      - name: Shopify app deploy
        if: ${{ env.SHOPIFY_CLI_PARTNERS_TOKEN != '' }}
        run: npx shopify app deploy --force

  app-server-deploy:
    runs-on: ubuntu-latest
    needs: shopify-deploy
    steps:
      - uses: actions/checkout@v4
      # Deploy the SSR app to your own host: ff-only pull, build, prisma migrate
      # deploy, restart the systemd unit, verify systemctl is-active. Wire this up
      # with your own DEPLOY_HOST / DEPLOY_SSH_KEY secrets (see deploy/systemd +
      # deploy/nginx for reference unit + vhost). Left as a no-op echo by default.
      - name: SSH deploy (placeholder — wire up your own DEPLOY_HOST / DEPLOY_SSH_KEY)
        run: |
          echo 'TODO: ssh $DEPLOY_HOST "cd busymate-ai-shopify && git pull --ff-only && npm ci && npm run build && npx prisma migrate deploy && sudo systemctl restart busymate-ai-shopify && systemctl is-active busymate-ai-shopify"'
