name: deploy
# Release-only: runs on a version tag push or manual dispatch — NEVER on a normal
# branch push or a pull_request, so day-to-day commits are validated by ci.yml alone
# and this workflow never needs a secret on an untrusted event.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# OWNER-GATED secrets required (repo → Settings → Secrets):
#   SHOPIFY_CLI_PARTNERS_TOKEN  — for `shopify app deploy` (extension + app config)
#   DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_KNOWN_HOSTS — app-server SSH deploy
# The separate Shopify extension step retains its existing secret guard. The
# app-server job refuses missing access, so green app-server means verified live.
jobs:
  shopify-deploy:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Deploys the theme extension + app config to Shopify (versioned by Shopify).
      # Skipped unless SHOPIFY_CLI_PARTNERS_TOKEN is configured.
      - name: Shopify app deploy
        if: ${{ env.SHOPIFY_CLI_PARTNERS_TOKEN != '' }}
        run: npx shopify app deploy --force

  app-server-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: app-server-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy exact app-server revision and verify live service
        run: bash scripts/deploy-app-host.sh "$GITHUB_SHA"
      - name: App-server release result
        if: always()
        run: |
          echo "App-server release $GITHUB_SHA: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Normal main merges do not deploy: use a version tag or an authorized manual release.' >> "$GITHUB_STEP_SUMMARY"
