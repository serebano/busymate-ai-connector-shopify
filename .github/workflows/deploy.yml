name: deploy
# Release-only: runs on a version tag push or manual dispatch — NEVER on a normal
# branch push or a pull_request, so day-to-day commits are validated by ci.yml alone
# and this workflow never needs a secret on an untrusted event.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# OWNER-GATED secret required (repo → Settings → Secrets):
#   SHOPIFY_CLI_PARTNERS_TOKEN  — for `shopify app deploy` (extension + app config)
# The app server itself ships from git main through k8s (busymate-ai-infra), not from
# this workflow. The Shopify extension step retains its existing secret guard.
jobs:
  shopify-deploy:
    # Our ephemeral k3s runner (scale set ci-connector-shopify); never GitHub-hosted (owner order 2026-11-04).
    runs-on: ci-connector-shopify
    timeout-minutes: 45
    env:
      SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Deploys the theme extension + app config to Shopify (versioned by Shopify).
      # Skipped unless SHOPIFY_CLI_PARTNERS_TOKEN is configured.
      - name: Shopify app deploy
        if: ${{ env.SHOPIFY_CLI_PARTNERS_TOKEN != '' }}
        run: npx shopify app deploy --force
