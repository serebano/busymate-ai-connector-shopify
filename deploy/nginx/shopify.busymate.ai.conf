# Busymate AI for Shopify — public edge for shopify.busymate.ai
# TLS (Let's Encrypt) terminates here; reverse-proxies to the React Router SSR
# app on 127.0.0.1:3970 (systemd unit busymate-ai-shopify.service).
#
# NOTE: this is the reference/final form. On the host, `certbot --nginx` manages
# the 443 server block + the ACME http-01 redirect; keep this file in sync.
# Do NOT add X-Frame-Options — the app is embedded in the Shopify admin iframe and
# sets its own frame-ancestors CSP via @shopify/shopify-app-react-router.

server {
    listen 80;
    listen [::]:80;
    server_name shopify.busymate.ai;
    # certbot serves .well-known/acme-challenge here; everything else → https.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shopify.busymate.ai;

    ssl_certificate     /etc/letsencrypt/live/shopify.busymate.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shopify.busymate.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Shopify webhooks + GraphQL responses can be sizeable.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3970;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # App Bridge / websocket upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
